<!-- 画像が .png / .jpeg / .webp で入っていても表示できるようにする保険 -->
<script>
(function () {
  var exts = ['.jpg', '.png', '.jpeg', '.webp', '.JPG', '.PNG'];
  Array.prototype.forEach.call(document.querySelectorAll('.lp img'), function (img) {
    img.addEventListener('error', function () {
      var i = exts.indexOf(img.dataset.ext || '.jpg');
      var next = exts[i + 1];
      if (!next) return;
      img.dataset.ext = next;
      img.src = img.src.replace(/\.[a-zA-Z]+$/, next);
    });
  });
})();
</script>
