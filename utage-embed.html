.aps-lp__faq-list{ display:flex; flex-direction:column; gap:12px; }

}
.aps-lp__q{

  line-height:1.55;
  color:#3a2a20;
}
.aps-lp__q::-webkit-details-marker{ display:none; }
.aps-lp__q::marker{ content:""; }
.aps-lp__q:focus-visible{ outline:2px solid #c3a87b; outline-offset:-4px; }
.aps-lp__mark{
  flex:0 0 auto;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#8d7a53;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  line-height:1;
}
.aps-lp__text{ flex:1 1 auto; }
.aps-lp__chev{
  flex:0 0 auto;
  width:18px;
  height:18px;
  color:#8d7a53;
  transition:transform .25s ease;
}
.aps-lp__item[open] .aps-lp__chev{ transform:rotate(180deg); }
.aps-lp__a{
  display:flex;
  gap:14px;
  padding:0 16px 18px;
  font-size:clamp(13px,3.8vw,15px);
  line-height:1.95;
  color:#5a4a3c;
}
.aps-lp__a .aps-lp__mark{ background:#efe7da; color:#8d7a53; }

.aps-lp__foot{

  background:#efe9dd;

  font-size:12px;
  line-height:1.9;

  color:#8b7c6d;
}

/* 画面下に出しっぱなしの予約ボタン */
.aps-lp-fixed{

  justify-content:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background:rgba(252,250,245,.92);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  border-top:1px solid #ece2d1;
  box-sizing:border-box;
}
.aps-lp-fixed a{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;

  color:#fff;
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:17px;
  letter-spacing:.12em;
  text-decoration:none;
}
@media (prefers-reduced-motion:reduce){
  .aps-lp__chev{ transition:none; }
}
